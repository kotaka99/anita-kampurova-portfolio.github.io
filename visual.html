<!DOCTYPE html>
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Anita Kamburova - Portfolio</title>
	<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
	<style>
		@import url('https://fonts.googleapis.com/css2?family=Crimson+Text&display=swap');
		* {
			
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}
		
		body {
				font-family: "Crimson Text", serif;
				background: #f5f5f5;
				color: #222;
				min-height: 100vh;
				display: flex;
		}
		
		.sidebar {
			width: 260px;
			background: #efefef;
			padding: 50px 40px;
			display: flex;
			height: 100vh;
			flex-direction: column;
			justify-content: flex-start;
		}
		
		.about, .cv {
			display: block;
			text-decoration: none;
			font-weight: 600;
			font-size: 17px;
			color: black;
			margin-bottom: 6px;

			transition: color 0.2s ease;
		}
		
		.about:hover, .cv:hover {
			color: #5a0f1a;
			cursor: pointer;
		}
		
		.about.active, .cv.active{
			color: #5a0f1a;
		}
		
		.sidebar h1 {
			font-family: "Crimson Text", serif;
			font-size: 25px;
			font-weight: 500;
			margin-bottom: 40px;
		}
		
		.menu-section {
			margin-bottom: 30px;
		}
		
		.menu-section-title {
			font-weight: 600;
			margin-bottom: 10px;
			font-size: 17px;
			cursor: pointer;
		}
		
		.menu {
			margin-left: 10px;
			transition: all 0.3s ease;
		}
		
		.menu.collapsed {
			display: none;
		}
		
		.menu a {
				display: block;
				text-decoration: none;
				color: #444;
				font-size: 17px;
				margin: 6px 0;
				cursor: pointer;
				transition: color 0.2s ease;
		}
		
		.menu a:hover {
			font-weight: 600;
			color: #5a0f1a;
		}
		
		.menu-section-title:hover {
			color: #5a0f1a;
			cursor: pointer;
		}
		
		.menu a.active {
			font-weight: 600;
			color: #5a0f1a;
		}
		
		.menu-section-title.active {
			color: #5a0f1a;
			font-weight: 700;
		}
		
		.main {
			flex: 1;
			padding: 60px 70px;
		}
		
		.page-title {
			font-family: "Crimson Text", serif;
			font-size: 32px;
			text-align: center;
			margin-bottom: 50px;
			font-weight: normal;
		}
		
		.project-grid {
			display: grid;
			grid-template-columns: 1fr 1fr;
		}
		
		.project {
			position: relative;
			overflow: hidden;
			cursor: pointer;
			height: 225px;
		}
		
		.project img {
			width: 100%;
			height: 100%;
			object-fit: cover;
			transition: transform 0.4s ease;
		}
		
		.project:hover img {
			transform: scale(1.05);
		}
		
		.overlay {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background: rgba(255, 255, 255, 0.75);
			display: flex;
			align-items: center;
			justify-content: center;
			font-family: "Crimson Text", serif;
			font-size: 28px;
			color: #6b1e1e;
			opacity: 0;
			transition: opacity 0.3s ease;
			pointer-events: none;
		}
		.overlay.text {
			top: -33px;
			background: rgba(0, 0, 0, 0);
			align-items: center;
			justify-content: center;
			font-size: 18px;
			color: grey;
			pointer-events: none;
		}
		
		.project:hover .overlay {
			opacity: 1;
		}
		
		.hidden {
			display: none !important;
		}
		
		.project.full {
			grid-column: span 2;
			height: 350px;
		}
	
		@media (max-width: 1024px) {

			.sidebar {
				width: 180px;
				padding: 30px 20px;

			}

			.menu-section {
				margin-bottom: 15px;
			}


			.page-title {
				font-size: 28px;
				margin-bottom: 30px;
			}

			.project-grid {
				grid-template-columns: repeat(2, 1fr);
				gap: 0;
			}

			.project {
				height: 225px;
			}

		}
		
		@media (max-width: 768px) {
			.sidebar {
				padding: 15px;
			}

			.main {
				padding: 15px;
			}
			
			.project-grid {
				grid-template-columns: repeat(2, 1fr);
				//gap: 8px;
			}

			.project {
				height: 180px;
			}

			.page-title {
				font-size: 24px;
			}

			.menu a,
			.about,
			.cv,
			.menu-section-title {
				font-size: 15px;
			}
		}
		
		@media (max-width: 480px) {

			.sidebar {
				width: 110px;
				padding: 15px 10px;
			}

			.sidebar h1 {
				font-size: 15px;
			}

			.overlay {
				font-size: clamp(11px, 2vw, 28px);
				text-align: center;
				padding: 0 6px;
			}
			
			.menu-section-title,
			.menu a,
			.about,
			.cv {
				font-size: 11px;
			}

			.main {
				padding: 12px;
			}

			.page-title {
				font-size: 20px;
			}

			.campaign-grid,
			.bottom-grid,
			.quote-grid {
				gap: 6px;
			}

			.hero-caption {
				font-size: 5px;
				padding: 8px;
			}
		}
	</style>
</head>
<body>
	<aside class="sidebar">
		<h1>Anita Kamburova</h1>
			
		<div class="menu-section">
			<div class="menu-section-title" id="work">Work</div>
			<div class="menu">
				<a href="advertising.html">Advertising</a>
				<!--<a href="socialmedia.html">Social Media</a>-->
				<a href="edication.html">Editorial & Layout</a>
			</div>
		</div>
			
		<div class="menu-section">
			<a class="about" href="about.html">About</a>
			<a class="cv" target="_blank" rel="noopener noreferrer" href="https://drive.google.com/file/d/1Fpq_1V3OK0IE8JnRBWEiUCGTWt_2dW_Q/view">Link to CV</a>
		</div>
			
		<div class="menu-section">
			<div class="menu-section-title" id="visualExploration">Visual Exploration</div>
			<div class="menu">
				<a href="personalproject.html">Personal Projects</a>
				<a href="visualstudies.html">Visual Studies</a>
			</div>
		</div>
	</aside>
	<main class="main">
		<div class="page-title"></div>
				
		<div class="project-grid" id="projectsGrid">
			<div class="project" data-category="advertising" id="advertisingProject">
				<img id="prjImg" src="https://cdn.myportfolio.com/bba462d2-ea02-48ce-b044-9d4aacab1454/bad79570-e93d-4269-9936-00f3d6870ada_carw_16x9x1280.jpeg?h=2a2a0491244a24d21e0ccc364ffd2fd0" />
				<div class="overlay">Personal Project</div>
				<!--<div class="overlay text">2026</div>-->
			</div>
			<div class="project" data-category="advertising" id="advertisingStudio">
				<img id="studioImg" src="https://lh3.googleusercontent.com/d/1L7Un1W3PxzWuMDqYx6_O3zMY4qbD-9Tt" />
				<div class="overlay">Visual Studies</div>
				<!--<div class="overlay text">2026</div>-->
			</div>
		</div>
	</main>
	<script>
		const visual = document.getElementById("visualExploration");
		const work = document.getElementById("work");
		const prjImg = document.getElementById("prjImg");
		const studioImg = document.getElementById("studioImg");
		
		prjImg.addEventListener("click", function() {
			window.location.href = "personalproject.html";
		})
		
		studioImg.addEventListener("click", function(){
			window.location.href = "visualstudies.html";
		})
		
		work.addEventListener("click", function() {
			window.location.href = "work.html";
		});
		
		visual.addEventListener("click", function() {
			window.location.href = "visual.html";
		});
		
		const links = document.querySelectorAll(".menu a");
		const currentPage = window.location.pathname.split("/").pop();
		
		links.forEach(link => {
			if(link.getAttribute("href") === currentPage) {
				link.classList.add("active")
				//link.closest(".menu-section").querySelector(".menu-section-title").classList.add("active");
			}
		});
		
		if(currentPage === "visual.html") {
			visual.classList.add("active");
		}
	</script>
</body>
</html>
